<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Praktik Versi Pertama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: satu langkah per layar, warna aksen mengikuti bagian di slide. */
:root{--bg0:#EEF1FB;--bg1:#F4F0FB;--bg2:#EAF2FD;--surface:rgba(255,255,255,.82);--surface-solid:#FFFFFF;--ink:#20244A;--muted:#6B7290;--line:rgba(99,91,208,.16);--blue:#5B5BD6;--blue-ink:#2E2A72;--blue-soft:#EAE9FB;--on-blue:#FFFFFF;--red:#E0529C;--red-soft:#FCE8F3;--ok:#1C9A6C;--ok-soft:#E3F6ED;--warn:#B4790C;--warn-soft:#FDF0DA;--yel:#FFC857;--grad1:#6C63D8;--grad2:#9A5BD6;--grad3:#4F8EF0;--grad4:#2FB6A3;--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg0:#0D1026;--bg1:#121530;--bg2:#0E1430;--surface:rgba(26,29,58,.78);--surface-solid:#181B3A;--ink:#EBEBFB;--muted:#A5A8CE;--line:rgba(150,146,255,.18);--blue:#9A96F5;--blue-ink:#D9D7FF;--blue-soft:#232560;--on-blue:#13153A;--red:#F28BC4;--red-soft:#3A2240;--ok:#6BDBA6;--ok-soft:#163327;--warn:#F2C572;--warn-soft:#3A2E12;color-scheme:dark}}
:root[data-theme="dark"]{--bg0:#0D1026;--bg1:#121530;--bg2:#0E1430;--surface:rgba(26,29,58,.78);--surface-solid:#181B3A;--ink:#EBEBFB;--muted:#A5A8CE;--line:rgba(150,146,255,.18);--blue:#9A96F5;--blue-ink:#D9D7FF;--blue-soft:#232560;--on-blue:#13153A;--red:#F28BC4;--red-soft:#3A2240;--ok:#6BDBA6;--ok-soft:#163327;--warn:#F2C572;--warn-soft:#3A2E12;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:var(--font);line-height:1.55;font-size:16px;-webkit-text-size-adjust:100%;background:var(--bg0);background-image:radial-gradient(760px 480px at 8% -6%,rgba(108,99,216,.22),transparent 60%),radial-gradient(820px 520px at 108% 0%,rgba(79,142,240,.20),transparent 55%),radial-gradient(900px 620px at 50% 115%,rgba(154,91,214,.16),transparent 60%);background-attachment:fixed;min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:22px 16px 96px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(26px,5vw,38px);font-weight:800;color:var(--blue-ink);letter-spacing:-.01em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--grad1),var(--grad3));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:20px;font-weight:800;color:var(--blue-ink);margin-bottom:6px;letter-spacing:-.01em}
h3{font-size:16px;font-weight:800;margin-bottom:6px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--blue-ink);margin:0 0 10px;background:var(--blue-soft);border:1px solid var(--line);padding:5px 12px 5px 6px;border-radius:999px}
.eyebrow img{height:22px;display:block;border-radius:6px}
.lead{color:var(--muted);margin:6px 0 14px;max-width:65ch}
.hint{display:block;color:var(--muted);font-size:13px;margin:0 0 6px}
.mut{color:var(--muted)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}
.theme{border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(10px);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px -10px rgba(46,42,114,.35)}
.stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0 18px}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(10px);border-radius:16px;padding:10px 4px;font:inherit;color:var(--ink);cursor:pointer;min-width:0;box-shadow:0 8px 20px -14px rgba(46,42,114,.3);transition:transform .15s ease}
.st:hover{transform:translateY(-1px)}
.st .n{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#C9C6EF,#E7E4FB);color:var(--blue-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.st:nth-child(1) .n{background:linear-gradient(135deg,var(--grad1),#8B7FF0)}
.st:nth-child(2) .n{background:linear-gradient(135deg,var(--grad3),#7FB3F5)}
.st:nth-child(3) .n{background:linear-gradient(135deg,var(--grad4),#6FD6C4)}
.st:nth-child(4) .n{background:linear-gradient(135deg,var(--grad2),#C08BE8)}
.st:nth-child(5) .n{background:linear-gradient(135deg,#F0A64F,#F5C878)}
.st:nth-child(6) .n{background:linear-gradient(135deg,var(--red),#F0A0C8)}
.st:nth-child(1) .n,.st:nth-child(2) .n,.st:nth-child(3) .n,.st:nth-child(4) .n,.st:nth-child(5) .n,.st:nth-child(6) .n{color:#fff}
.st .t{font-size:11px;font-weight:700;text-align:center;line-height:1.2;overflow-wrap:anywhere;color:var(--muted)}
.st[aria-current="step"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue),0 10px 24px -12px rgba(91,91,214,.5)}
.st[aria-current="step"] .t{color:var(--blue-ink)}
.st.done .n{background:linear-gradient(135deg,var(--ok),#49C98E)!important;color:#fff}
.stepname{font-weight:800;color:var(--blue-ink);margin:0 0 12px}
.panel[hidden]{display:none}
.panel{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 40px -26px rgba(46,42,114,.45)}
.card.accent{position:relative}
.card.accent::before{content:"";position:absolute;left:20px;right:20px;top:0;height:4px;border-radius:0 0 6px 6px;background:linear-gradient(90deg,var(--grad1),var(--grad3))}
.p1 .card.accent::before{background:linear-gradient(90deg,var(--red),var(--grad2))}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--red-soft);border:1px solid var(--red);border-radius:14px;padding:12px 14px;color:var(--ink)}
.note svg{flex:none;color:var(--red)}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rules li{display:flex;gap:12px;align-items:flex-start}
.dot{flex:none;width:28px;height:28px;border-radius:10px;background:linear-gradient(135deg,var(--grad1),var(--grad3));color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.rules b{display:block}
.myth{display:grid;gap:8px}
.myth div{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg1)}
.myth s{color:var(--red);text-decoration-thickness:2px}
.myth b{display:block;color:var(--blue-ink)}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:10px 0 14px}
.case{position:relative;display:block;border:2px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;cursor:pointer;background:var(--surface-solid)}
.case input{position:absolute;opacity:0}
.case:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.case:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:2px}
.case b{display:block}
.case small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.tag{display:inline-block;margin-top:8px;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px}
.tag.ok{background:var(--blue-soft);color:var(--blue-ink)}
.tag.small{background:var(--red-soft);color:var(--red)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>label,.f{font-weight:700;font-size:14px}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--bg1);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:92px;resize:vertical}
textarea.mono,pre.mono,.mono{font-family:var(--mono);font-size:13px;line-height:1.5}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:800;border-radius:999px;padding:10px 18px;cursor:pointer;border:0;background:linear-gradient(135deg,var(--grad1),var(--grad3));color:#fff;box-shadow:0 10px 24px -12px rgba(91,91,214,.6)}
.btn.ghost{background:var(--surface-solid);color:var(--blue-ink);border:1.5px solid var(--line);box-shadow:none}
.btn.red{background:linear-gradient(135deg,var(--red),var(--grad2));color:#fff}
.btn.sm{padding:7px 14px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg1)}
.seg button{font:inherit;font-weight:700;font-size:14px;border:0;background:transparent;color:var(--ink);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--grad1),var(--grad3));color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--blue);flex:none}
.chk small{display:block;color:var(--muted)}
.res{border:1px solid var(--ok);background:var(--surface-solid);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 40px -26px rgba(28,154,108,.35)}
.res[hidden]{display:none}
.reshead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.info{background:var(--blue-soft);color:var(--blue-ink)}
.stamp{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--bg1);font-size:12px;color:var(--muted)}
td.r,th.r{text-align:right}
tr.bad td{background:var(--red-soft)}
tr.good td{background:var(--ok-soft)}
tfoot td{font-weight:800;border-top:2px solid var(--line)}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:start}
.node{text-align:center}
.node .c{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;line-height:1.2;padding:6px;background:linear-gradient(135deg,var(--yel),#FFE3A1);color:#6B4400}
.node.a .c{background:linear-gradient(135deg,var(--grad1),var(--grad3));color:#fff}
.node p{margin:0;font-size:14px;overflow-wrap:anywhere}
.arrow{align-self:center;margin-top:26px;color:var(--blue)}
.prompt{background:var(--blue-ink);color:#F3F6FB;border-radius:16px;padding:14px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
:root[data-theme="dark"] .prompt{background:#0A0D22;border:1px solid var(--line)}
.diag{display:grid;gap:8px}
.diag div{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.diag b{display:block}
.diag .pill{flex:none;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg1)}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.drop{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;background:var(--bg1)}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.msg{font-size:14px;margin:6px 0 0}
.msg.bad{color:var(--red)}
.msg.ok{color:var(--ok)}
.prev{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}
.navbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;gap:8px}
.navbar .in{max-width:920px;margin:0 auto;width:100%;display:flex;justify-content:space-between;gap:8px}
details{border:1px solid var(--line);border-radius:16px;padding:12px 16px;background:var(--surface-solid)}
summary{cursor:pointer;font-weight:800}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg);margin:0 auto}.st .t{font-size:9px;overflow-wrap:normal}.stepper{gap:4px}}
@media (prefers-reduced-motion:no-preference){.res{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
